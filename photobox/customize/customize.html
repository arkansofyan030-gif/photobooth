<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Jankbox — Customize
    </title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="customize.css">

</head>


<body>


    <!-- HEADER -->

    <header class="custom-header">

        <a href="/home/home.html" class="logo">
            JANK<span>BOX</span>
        </a>


        <div class="page-label">

            CUSTOMIZE / 002

        </div>


        <div class="step">

            02 / 03

        </div>

    </header>



    <!-- MAIN -->

    <main class="customize-page">


        <!-- LEFT : PREVIEW -->

        <section class="preview-section">


            <div class="preview-label">

                <span>
                    LIVE PREVIEW
                </span>

                <span>
                    JKB_002
                </span>

            </div>


            <div class="photostrip" id="photostrip">

                <!-- photos generated by JS -->


                <div class="strip-brand">

                    JANKBOX

                </div>


                <div class="strip-date">

                    09.25.26

                </div>

            </div>


        </section>



        <!-- RIGHT : CONTROLS -->

        <section class="custom-controls">


            <div class="custom-intro">

                <span class="eyebrow">
                    MAKE IT YOURS
                </span>


                <h1>

                    YOUR<br>

                    <span>VIBE.</span>

                </h1>


                <p>
                    Pick a look for your photostrip before you take it home.
                </p>

            </div>



            <!-- FILTER -->

            <div class="control-group">

                <div class="control-title">

                    FILTER

                </div>


                <div class="options">

                    <button class="option active" data-filter="normal">
                        ORIGINAL
                    </button>


                    <button class="option" data-filter="film">
                        FILM
                    </button>


                    <button class="option" data-filter="bw">
                        B&W
                    </button>


                    <button class="option" data-filter="warm">
                        WARM
                    </button>

                </div>

            </div>



            <!-- FRAME -->

            <div class="control-group">

                <div class="control-title">

                    FRAME

                </div>


                <div class="options">

                    <button class="option active" data-frame="classic">
                        CLASSIC
                    </button>


                    <button class="option" data-frame="y2k">
                        Y2K
                    </button>


                    <button class="option" data-frame="minimal">
                        MINIMAL
                    </button>

                </div>

            </div>



            <!-- FINISH -->

            <button id="finishButton" class="finish-button">

                <span>
                    FINISH PHOTO
                </span>

                <span>
                    ↗
                </span>

            </button>


        </section>

    </main>



    <script src="customize.js"></script>

</body>

</html>
