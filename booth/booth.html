<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jankbox — Photo Booth</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="booth.css">

</head>


<body>

    <!-- TOP BAR -->

    <header class="booth-header">

        <a href="../home/home.html" class="logo">
            JANK<span>BOX</span>
        </a>

        <div class="booth-mode">
            DIGITAL PHOTOBOOTH
        </div>

        <div class="shot-counter">

            <span id="currentShot">00</span>
            <span>/ 04</span>

        </div>

    </header>


    <!-- MAIN BOOTH -->

    <main class="booth-page">

        <!-- CAMERA SECTION -->

        <section class="camera-section" id="cameraSection">

            <div class="camera-wrapper">

                <video id="camera" autoplay playsinline muted>
            </video>

                <div class="camera-ui">

                    <div class="camera-corner top-left"></div>
                    <div class="camera-corner top-right"></div>

                    <div class="camera-corner bottom-left"></div>
                    <div class="camera-corner bottom-right"></div>

                    <div class="camera-status">
                        <span class="record-dot"></span> LIVE
                    </div>

                    <div id="countdown" class="countdown">
                    </div>

                </div>

            </div>

            <div class="camera-info">

                <span>
                JKB / CAM 01
            </span>

                <span id="cameraMessage">
                CAMERA READY
            </span>

                <span>
                640 × 480
            </span>

            </div>

        </section>


        <!-- CONTROL SECTION -->

        <section class="control-section" id="controlSection">

            <div class="control-intro">

                <span class="eyebrow">
                PHOTO SESSION / 001
            </span>

                <h1>
                    READY<br>
                    <span>WHEN YOU</span><br> ARE.
                </h1>

                <p>
                    Four shots. One photostrip. Make a face, fix your hair, or just be yourself.
                </p>

            </div>


            <button id="startButton" class="start-button">

            <span>
                START SESSION
            </span>

            <span class="button-arrow">
                ↗
            </span>

        </button>


            <div class="session-info">

                <div>

                    <span class="info-number">
                    01
                </span>

                    <span>
                    GET READY
                </span>

                </div>

                <div>

                    <span class="info-number">
                    04
                </span>

                    <span>
                    FINAL SHOT
                </span>

                </div>

            </div>

        </section>


        <!-- REVIEW SECTION -->

        <section class="review-section" id="reviewSection">

            <div class="review-header">

                <div>

                    <span class="eyebrow">
                    SESSION COMPLETE
                </span>

                    <h2>
                        YOUR<br>
                        <span>MOMENTS.</span>
                    </h2>

                </div>

                <div class="review-counter">
                    04 / 04
                </div>

            </div>


            <div class="photo-grid" id="photoGrid">

                <!-- Photos will be inserted by JavaScript -->

            </div>


            <div class="review-actions">

                <button id="retakeButton" class="secondary-button">

                RETAKE

            </button>


                <button id="continueButton" class="primary-button">

                CONTINUE

                <span>↗</span>

            </button>

            </div>

        </section>

    </main>


    <!-- FLASH -->

    <div id="flash" class="flash">
    </div>



    <script src="booth.js"></script>

</body>

</html>
