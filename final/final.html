<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jankbox — Final</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="final.css">
</head>

<body>

    <!-- HEADER -->

    <header class="final-header">

        <a href="../home/home.html" class="logo">
            JANK<span>BOX</span>
        </a>

        <div class="page-label">
            FINAL / 003
        </div>

        <div class="step">
            03 / 03
        </div>

    </header>


    <!-- MAIN -->

    <main class="final-page">

        <!-- LEFT -->

        <section class="final-preview">

            <div class="preview-label">
                <span>FINAL PHOTOSTRIP</span>
                <span>JKB_003</span>
            </div>

            <div class="strip-stage">

                <div class="photostrip-final" id="photostripFinal">

                    <div id="finalPhotos"></div>

                    <div class="final-brand">
                        JANKBOX
                    </div>

                    <div class="final-date">
                        09.25.26
                    </div>

                </div>

            </div>

        </section>


        <!-- RIGHT -->

        <section class="final-content">

            <div class="final-intro">

                <span class="eyebrow">
                    SESSION COMPLETE
                </span>

                <h1>
                    YOUR<br>
                    <span>MOMENTS.</span>
                </h1>

                <p>
                    Four shots. One frame. Yours to keep.
                </p>

            </div>


            <div class="final-meta">

                <div class="meta-row">
                    <span>FORMAT</span>
                    <span>JANKBOX STRIP</span>
                </div>

                <div class="meta-row">
                    <span>SHOTS</span>
                    <span>04 / 04</span>
                </div>

                <div class="meta-row">
                    <span>STATUS</span>
                    <span>READY</span>
                </div>

            </div>


            <div class="final-actions">

                <button id="downloadButton" class="download-button">
                    <span>DOWNLOAD PHOTO</span>
                    <span>↓</span>
                </button>

                <button id="newSessionButton" class="secondary-button">
                    TAKE ANOTHER SET
                    <span>↗</span>
                </button>

            </div>

        </section>

    </main>


    <script src="final.js"></script>

</body>

</html>
